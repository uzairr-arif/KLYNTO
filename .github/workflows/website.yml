name: Website

# Deploys the product landing page (website/) to GitHub Pages.
# One-time enablement: repo Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". After that, every push that touches website/
# (or a manual run) publishes the site.
# Vercel alternative: import the repo, set Root Directory to "website".

on:
  push:
    branches: [main]
    paths: ['website/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
