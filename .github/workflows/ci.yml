name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Chrome: build → verify → package (dist holds the chrome manifest here)
      - name: Build (chrome)
        run: npm run build:chrome

      - name: Verify chrome manifest + entries exist
        run: |
          node -e "
            const m = require('./dist/manifest.json');
            const fs = require('fs');
            const entries = [
              m.action.default_popup,
              m.options_page,
              m.devtools_page,
              m.background.service_worker,
              ...Object.values(m.icons),
            ];
            for (const key of entries) {
              if (!key || !fs.existsSync('dist/' + key)) throw new Error('missing dist/' + key);
            }
            if (m.background.service_worker !== 'background/service-worker.js') {
              throw new Error('chrome manifest is missing the service worker entry');
            }
            console.log('chrome manifest OK:', m.name, m.version);
          "

      - name: Package chrome ZIP
        run: npm run package -- --target chrome

      # Firefox: build → verify → package (dist holds the firefox manifest here)
      - name: Build (firefox, experimental)
        run: npm run build:firefox

      - name: Verify firefox manifest + entries exist
        run: |
          node -e "
            const m = require('./dist/manifest.json');
            const fs = require('fs');
            const entries = [
              m.action.default_popup,
              m.options_page,
              m.devtools_page,
              ...(m.background.scripts || []),
              ...Object.values(m.icons),
            ];
            for (const key of entries) {
              if (!key || !fs.existsSync('dist/' + key)) throw new Error('missing dist/' + key);
            }
            if (!Array.isArray(m.background.scripts) || m.background.scripts.length === 0) {
              throw new Error('firefox manifest is missing background scripts');
            }
            console.log('firefox manifest OK:', m.name, m.version);
          "

      - name: Package firefox ZIP
        run: npm run package -- --target firefox

      - uses: actions/upload-artifact@v4
        with:
          name: klynto-extension-zips
          path: releases/*.zip
          retention-days: 14
