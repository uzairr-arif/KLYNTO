name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (chrome)
        run: npm run build:chrome

      - name: Build (firefox, experimental)
        run: npm run build:firefox

      - name: Verify manifest + entries exist
        run: |
          node -e "
            const m = require('./dist/manifest.json');
            const fs = require('fs');
            for (const key of [m.action.default_popup, m.options_page, m.devtools_page, m.background.service_worker]) {
              if (!fs.existsSync('dist/' + key)) throw new Error('missing dist/' + key);
            }
            for (const icon of Object.values(m.icons)) {
              if (!fs.existsSync('dist/' + icon)) throw new Error('missing dist/' + icon);
            }
            console.log('manifest OK:', m.name, m.version);
          "

      - name: Package ZIP
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: klynto-chrome
          path: releases/*.zip
          retention-days: 14
