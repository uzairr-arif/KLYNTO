name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build + verify + package (chrome)
        run: |
          npm run build:chrome
          node -e "
            const m = require('./dist/manifest.json');
            const fs = require('fs');
            const entries = [m.action.default_popup, m.options_page, m.devtools_page, m.background.service_worker, ...Object.values(m.icons)];
            for (const key of entries) {
              if (!key || !fs.existsSync('dist/' + key)) throw new Error('missing dist/' + key);
            }
            console.log('chrome manifest OK:', m.name, m.version);
          "
          npm run package -- --target chrome

      - name: Build + verify + package (firefox)
        run: |
          npm run build:firefox
          node -e "
            const m = require('./dist/manifest.json');
            const fs = require('fs');
            const entries = [m.action.default_popup, m.options_ui && m.options_ui.page, m.devtools_page, ...(m.background.scripts || []), ...Object.values(m.icons)];
            for (const key of entries) {
              if (!key || !fs.existsSync('dist/' + key)) throw new Error('missing dist/' + key);
            }
            if (!Array.isArray(m.background.scripts) || m.background.scripts.length === 0) {
              throw new Error('firefox manifest is missing background scripts');
            }
            if (!m.options_ui || m.options_page) {
              throw new Error('firefox manifest must use options_ui, not options_page');
            }
            console.log('firefox manifest OK:', m.name, m.version);
          "
          npm run package -- --target firefox

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
